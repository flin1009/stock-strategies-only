name: V3 Daily Signal

on:
  schedule:
    # 台灣時間 18:19 = UTC 10:19 (待 FinMind 日K 17:30 與 TWSE/TPEx 法人及 PE 18:00 前發布齊全，採冷門質數分鐘)
    - cron: '19 10 * * 1-5'
  workflow_dispatch:  # 允許手動觸發測試

jobs:
  run-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: uv sync

      - name: Cache market & FinMind data
        uses: actions/cache@v4
        with:
          path: .cache
          key: stock-cache-${{ github.run_id }}
          restore-keys: |
            stock-cache-

      - name: Run signal engine
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: uv run python main.py
