name: Chips Streak Evening Scan

on:
  schedule:
    # 台灣時間 21:43 = UTC 13:43（每週一至週五晚間，待 TWSE 融資融券 MI_MARGN 21:00-21:30 結算完成，採冷門質數分鐘）
    - cron: '43 13 * * 1-5'
  workflow_dispatch:  # 允許手動觸發測試

env:
  TZ: Asia/Taipei

jobs:
  run-chips-streak:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: uv sync

      - name: Cache market & FinMind data
        uses: actions/cache@v4
        with:
          path: .cache
          key: stock-cache-${{ github.run_id }}
          restore-keys: |
            stock-cache-

      - name: Run chips streak scanner
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: uv run python chips_streak.py
